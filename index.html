<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PhishScan AI - URL Scanner</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(270deg, #1f4037, #99f2c8);
            background-size: 600% 600%;
            animation: bgMove 15s ease infinite;
            color: white;
        }

        @keyframes bgMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass {
            width: 600px;
            max-width: 90%;
            padding: 50px;
            border-radius: 20px;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(20px);
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
        }

        h1 { font-size: 36px; margin-bottom: 10px; }
        p { margin-bottom: 30px; opacity: 0.9; }

        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 18px 25px;
            border-radius: 12px;
            border: none;
            outline: none;
            font-size: 16px;
            background: rgba(255,255,255,0.2);
            color: white;
            transition: 0.3s;
        }

        input::placeholder { color: rgba(255,255,255,0.7); }
        input:focus { background: rgba(255,255,255,0.3); }

        .scan-btn {
            width: 100%;
            padding: 18px;
            border-radius: 12px;
            border: none;
            background: #0ba360;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .scan-btn:hover { background: #088a50; transform: translateY(-2px); }

        .progress-container {
            margin-top: 30px;
            display: none;
        }

        .progress-bar-bg {
            width: 100%;
            height: 12px;
            background: rgba(255,255,255,0.2);
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #fff;
            transition: 0.1s;
        }

        .status-text {
            margin-top: 10px;
            font-size: 14px;
            font-style: italic;
        }
    </style>
</head>

<body>

<div class="glass">
    <h1>PhishScan AI</h1>
    <p>Enter a URL to analyze it using Deep Learning</p>

    <div class="input-group">
        <input type="text" id="urlInput" placeholder="https://example.com/login" required>
    </div>

    <button class="scan-btn" id="analyzeBtn" onclick="startAnalysis()">Analyze URL</button>

    <div class="progress-container" id="progressContainer">
        <div class="progress-bar-bg">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="status-text" id="statusText">Extracting features...</div>
    </div>
</div>

<script>
// Use Electron's IPC to communicate with main.js
const { ipcRenderer } = require('electron');

async function startAnalysis() {
    const url = document.getElementById("urlInput").value;
    if (!url) {
        alert("Please enter a valid URL.");
        return;
    }

    // UI Feedback Initialization
    const progressContainer = document.getElementById("progressContainer");
    const progressBar = document.getElementById("progressBar");
    const statusText = document.getElementById("statusText");
    const scanBtn = document.getElementById("analyzeBtn");
    
    progressContainer.style.display = "block";
    scanBtn.disabled = true;
    scanBtn.innerText = "Analyzing...";

    // Visual progress bar animation
    let width = 0;
    const interval = setInterval(() => {
        if (width >= 90) {
            clearInterval(interval);
        } else {
            width += 2;
            progressBar.style.width = width + "%";
            if (width > 30) statusText.innerText = "Extracting URL features...";
            if (width > 60) statusText.innerText = "Running Machine Learning Model...";
            if (width > 85) statusText.innerText = "Finalizing verdict...";
        }
    }, 100);

    try {
        // CALL THE ML MODEL ENGINE
        console.log("Initiating scan for:", url);
        const result = await ipcRenderer.invoke('scan-url', url);
        console.log("Raw Result from Engine:", result);

        // Store for use in safe.html or unsafe.html
        localStorage.setItem("scannedURL", url);

        // Complete the bar
        clearInterval(interval);
        progressBar.style.width = "100%";
        statusText.innerText = "Analysis Complete!";

        // REDIRECT LOGIC: 
        // We check for the character '1' specifically to avoid confusion with UserWarnings
        setTimeout(() => {
            if (result && result.toString().includes("1")) {
                console.log("Phishing detected. Redirecting to warning page.");
                window.location.href = "unsafe.html";
            } else {
                console.log("URL appears safe. Redirecting to success page.");
                window.location.href = "safe.html";
            }
        }, 600);

    } catch (error) {
        console.error("Analysis failed:", error);
        alert("An error occurred during analysis. Press Ctrl+Shift+I to see logs.");
        clearInterval(interval);
        scanBtn.disabled = false;
        scanBtn.innerText = "Analyze URL";
        progressContainer.style.display = "none";
    }
}
</script>

</body>
</html>
